<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de administración – 3DPM</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="admin-body">

  <!-- LOGIN -->
  <div id="login-view" class="admin-login-wrapper">
    <form id="login-form" class="admin-login-box">
      <h1>Panel de administración</h1>
      <p class="admin-subtitle">Ingresá con la cuenta que te compartió ahdesign.</p>
      <label>
        Email
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label>
        Contraseña
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <p id="login-error" class="admin-error"></p>
      <button type="submit" class="btn btn-solid">Ingresar</button>
    </form>
  </div>

  <!-- PANEL -->
  <div id="admin-view" class="admin-wrapper" style="display:none;">
    <header class="admin-header">
      <h1>Productos de 3DPM</h1>
      <button id="logout-btn" class="btn btn-outline">Cerrar sesión</button>
    </header>

    <section class="admin-form-section">
      <h2 id="form-title">Agregar producto</h2>
      <form id="product-form" class="admin-form">
        <input type="hidden" id="editing-id" value="" />

        <label>
          Nombre
          <input type="text" id="nombre" required />
        </label>

        <label>
          Precio (ARS)
          <input type="number" id="precio" min="0" step="1" required />
        </label>

        <label>
          Categoría
          <select id="categoria" required></select>
        </label>

        <label>
          Subcategoría
          <select id="subcategoria" required disabled>
            <option value="">Elegí primero una categoría</option>
          </select>
        </label>

        <label>
          Descripción
          <textarea id="descripcion" rows="3" required></textarea>
        </label>

        <label>
          Link de la foto (Google Drive u otro)
          <input type="text" id="imagen-url" placeholder="Pegá acá el link para compartir de Drive" />
        </label>
        <p class="admin-help-text">En Drive: click derecho en la imagen → Compartir → "Cualquiera con el enlace" → Copiar enlace, y pegalo tal cual acá arriba.</p>
        <img id="imagen-preview" class="admin-image-preview" style="display:none;" alt="Vista previa de la imagen" />
        <p id="imagen-preview-error" class="admin-error"></p>

        <div class="admin-form-actions">
          <button type="submit" id="submit-btn" class="btn btn-solid">Agregar producto</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-outline" style="display:none;">Cancelar edición</button>
        </div>
      </form>
    </section>

    <section class="admin-list-section">
      <h2>Tus productos</h2>
      <div id="admin-product-list" class="admin-product-list">
        <p class="empty-state">Cargando productos...</p>
      </div>
    </section>
  </div>

  <script src="categorias.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
